<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Feelbetter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Feelbetter</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="public/app-icon.png" />
    <link rel="apple-touch-icon" href="public/app-icon.png" />
    <link rel="stylesheet" href="styles.css?v=pitch-polish-20260518" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-topbar" data-build="scroll-away-topbar-20260517-1152" aria-live="polite">
        <div class="app-topbar-copy">
          <p class="eyebrow" id="topbar-eyebrow">Feelbetter</p>
          <h1 id="topbar-title">Hoe voel ik mij vandaag?</h1>
          <p class="date-label" id="topbar-date"></p>
        </div>
        <button class="settings-icon-button" type="button" data-screen="settings" aria-label="Instellingen">
          <span aria-hidden="true">⚙</span>
        </button>
      </header>

      <section class="screen active" id="screen-today">
        <div id="today-content"></div>
      </section>

      <section class="screen" id="screen-checkin">
        <div class="stack" id="checkin-summary" hidden></div>
        <form class="stack" id="checkin-form">
          <div class="card form-card">
            <label class="field">
              <span>Slaapuren</span>
              <input id="sleep-hours" type="text" inputmode="decimal" placeholder="Bijv. 7.5" />
            </label>

            <fieldset class="field">
              <legend>Focus</legend>
              <div class="segmented segmented-four" role="radiogroup" aria-label="Focus">
                <button type="button" data-focus="slecht">Slecht</button>
                <button type="button" data-focus="moeilijk">Moeilijk</button>
                <button type="button" data-focus="prima" class="selected">Prima</button>
                <button type="button" data-focus="scherp">Scherp</button>
              </div>
            </fieldset>

            <fieldset class="field">
              <legend>Stemming</legend>
              <div class="segmented segmented-four" role="radiogroup" aria-label="Stemming">
                <button type="button" data-mood="slecht">Slecht</button>
                <button type="button" data-mood="neutraal" class="selected">Neutraal</button>
                <button type="button" data-mood="goed">Goed</button>
                <button type="button" data-mood="heel-goed">Heel goed</button>
              </div>
            </fieldset>

            <fieldset class="field">
              <legend>Voeding</legend>
              <div class="segmented" role="radiogroup" aria-label="Voeding">
                <button type="button" data-nutrition="slecht">Slecht</button>
                <button type="button" data-nutrition="oke" class="selected">Oke</button>
                <button type="button" data-nutrition="goed">Goed</button>
              </div>
            </fieldset>

            <label class="field">
              <span>Korte notitie</span>
              <textarea id="day-note" rows="4" maxlength="240" placeholder="Wat viel vandaag op?"></textarea>
            </label>

            <p class="error-message" id="form-error" role="alert"></p>
          </div>

          <button class="primary-button" type="submit">Opslaan en analyse bekijken</button>
        </form>
      </section>

      <section class="screen" id="screen-result">
        <div class="stack" id="result-content"></div>
      </section>

      <section class="screen" id="screen-week">
        <div id="week-content"></div>
      </section>

      <section class="screen" id="screen-buddy">
        <div class="stack" id="buddy-content"></div>
      </section>

      <section class="screen" id="screen-settings">
        <div class="stack">
          <div class="card settings-card">
            <div>
              <h2>Weergave</h2>
              <p>Pas aan hoe de app eruitziet op dit apparaat.</p>
            </div>

            <label class="setting-row" for="dark-mode-toggle">
              <span>
                <strong>Dark mode</strong>
                <small>Rustiger licht in de avond.</small>
              </span>
              <input id="dark-mode-toggle" type="checkbox" role="switch" />
            </label>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Navigatie">
      <button type="button" data-screen="today" class="active">Vandaag</button>
      <button type="button" data-screen="checkin">Check-in</button>
      <button type="button" data-screen="week">Progressie</button>
      <button type="button" data-screen="buddy">Buddy</button>
    </nav>

    <script src="app.js?v=buddy-duration-fix-20260519"></script>
  </body>
</html>
